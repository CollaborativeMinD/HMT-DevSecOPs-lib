[defaults]
# Point to your dynamic or static local inventory
inventory = ./inventory.ini

# Optimize for a 3-node cluster + desktop setup (Default is 5)
# Limits simultaneous processes to prevent CPU spike bottlenecks on Pi nodes
forks = 5

# Ensure agents don't hang indefinitely on a dead node
timeout = 30

# Speeds up playbook execution by gathering facts only once per play
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ./.ansible_fact_cache
fact_caching_timeout = 86400

# Automated pipelines require non-interactive execution
host_key_checking = False
retry_files_enabled = False

# Ensure clean stdout presentation for parsing agent logs
stdout_callback = yaml
callbacks_enabled = profile_tasks

[ssh_connection]
# CRITICAL: Enables SSH pipelining. Reduces the number of SSH operations 
# required to execute a module, drastically cutting execution time on Pis.
pipelining = True

# Reuses SSH connections across tasks to bypass the TLS handshake overhead
# over local/virtual mesh interfaces.
ssh_args = -o ControlMaster=auto -o ControlKeepAlive=yes -o ControlPath=/tmp/ansible-ssh-%%h-%%p-%%r -o ControlPersist=60m
