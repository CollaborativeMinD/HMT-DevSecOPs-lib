apiVersion: apps/v1
kind: Deployment
metadata:
  name: automation-remediation-worker
  namespace: monitoring
  labels:
    app: telemetry
    component: automation-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry
      component: automation-worker
  template:
    metadata:
      labels:
        app: telemetry
        component: automation-worker
    spec:
      # Link to the exact ServiceAccount generated by Terraform
      serviceAccountName: automation-agent-sa
      containers:
        - name: worker
          image: custom-registry.local/devops/remediation-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: REDIS_URL
              value: "redis://redis-service.monitoring.svc.cluster.local:6379/0"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
