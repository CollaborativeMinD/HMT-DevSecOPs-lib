---
# ==========================================
# 1. GRAFANA STORAGE (Shared / Workstation)
# ==========================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-grafana
  labels:
    app: telemetry
    component: grafana
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: telemetry-local-storage
  local:
    path: /var/lib/k8s/main-storage/grafana
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - workstation
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-grafana
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: telemetry-local-storage
  resources:
    requests:
      storage: 10Gi
  selector:
    matchLabels:
      component: grafana

---
