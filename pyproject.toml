[project]
name = "hmt-devsecops-tools"
version = "1.1.0"
description = "Bounded, evidence-first lab DevSecOps operations and MCP gateway"
requires-python = ">=3.12,<3.16"
license = "Apache-2.0"
dependencies = ["fastapi==0.165.0", "pydantic==2.13.5", "uvicorn==0.48.0", "prometheus-client==0.25.0"]
[project.scripts]
hmt-devsecops = "hmt_devsecops.cli:main"
hmt-devsecops-mcp = "hmt_devsecops.stdio:main"
hmt-devsecops-deploy = "hmt_devsecops.deployment:main"
[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.2.0", "pytest-cov==7.1.0"]
[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/hmt_devsecops"]
[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q --strict-config --strict-markers"
[tool.coverage.run]
branch=true
source=["hmt_devsecops"]
[tool.coverage.report]
show_missing=true
fail_under=90
